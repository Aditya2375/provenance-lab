name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node tests/test_manifest.mjs && node tests/test_tokenizer.mjs
      - run: test "$(sha256sum docs/model/2-model-int8.onnx | cut -d ' ' -f1)" = 4b821a8a7ca53a447446b85a7e864cfd665cb5dc3d2fb59e3f1a69424cbba760
